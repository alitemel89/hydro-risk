services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hydro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
      POSTGRES_DB: hydro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hydro-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydro"]
      interval: 5s
      retries: 10
volumes:
  hydro-data:
