name: İzmir72 tests
on:
  push:
    branches:
      - feature/izmir72-ecmwf-v01
    paths:
      - 'izmir72/**'
      - '.github/workflows/izmir72-tests.yml'
  pull_request:
    paths:
      - 'izmir72/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r izmir72/requirements-dev.txt
      - name: Run unit tests
        working-directory: izmir72
        run: python -m pytest -q
